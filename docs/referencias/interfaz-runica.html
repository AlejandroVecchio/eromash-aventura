const studies={es:`<h2>La delicadeza también es nórdica</h2><p class="lead">Runas como identidad. Plata grabada como soporte. Convenciones conocidas para jugar sin aprender un idioma visual nuevo.</p><article><h3>01 · Guerreros, duelos y «gladiadores»</h3><p>«Gladiador nórdico» funciona como fantasía de Eromash; las fuentes consultadas no justifican tratarlo como una institución histórica equivalente a la romana. El estudio académico <a href="https://pure.kb.dk/ws/portalfiles/portal/117969574/1-s2.0-S0278416525000066-main.pdf">Warrior institutions and martial networks in Viking-Age Scandinavia</a> aborda redes y grupos guerreros, incluidos berserkir y ulfheðnar. Son mejores puntos de partida que una clase única de combatiente de arena.</p><p>El <a href="https://natmus.dk/historisk-viden/danmark/oldtid-indtil-aar-1050/vikingetiden-800-1050/vaaben/bersaerk/">Museo Nacional de Dinamarca</a> distingue explicaciones alternativas del término berserkr y reconoce los límites de la evidencia arqueológica. Las sagas no equivalen a una fotografía de la vida vikinga. No trasladamos automáticamente furia, pieles y brutalidad a toda la interfaz.</p><p>El hólmgang aporta la idea de un duelo reglado. <a href="https://hurstwic.com/history/articles/society/text/drengur.htm">Hurstwic</a> reúne relatos y reglas presentes en sagas: es una referencia de reconstrucción, no prueba de una regla universal. Aplicación propuesta: composición simétrica, emblemas sobrios y lectura clara de arma frente a escudo; no introducir un sistema de duelos nuevo.</p></article><article><h3>02 · Urnes: una referencia para el trazo</h3><p>El <a href="https://www.britishmuseum.org/collection/term/x95689">British Museum</a> describe animales esbeltos, ojos alargados y cintas entrelazadas en el estilo Urnes, aproximadamente de mediados del XI a principios del XII. El <a href="https://www.britishmuseum.org/collection/object/H_1979-1101-1">broche de Pitney</a> permite estudiar calados y curvas con aire entre ellas.</p><p>Aplicación propia: líneas de 1–1,5 px a resolución de referencia, curvas largas en esquinas y separadores, pocos cruces y mucho espacio libre. El ornamento nunca atraviesa números, nombres o iconos. No copiamos la pieza arqueológica ni importamos imágenes de terceros.</p></article><article><h3>03 · Vegvísir: orientación y memoria</h3><p>El signo está documentado en Huld, compilado por Geir Vigfússon en 1860; esto no acredita un origen vikingo. La <a href="https://commons.wikimedia.org/wiki/File:Vegvisir-huld-p60.png">reproducción del manuscrito</a>, atribuida a la Biblioteca Nacional y Universitaria de Islandia, conserva el signo y la instrucción de llevarlo para no perderse con mal tiempo. El <a href="https://handrit.is/manuscript/view/is/IB04-0383">catálogo ÍB 383 4to</a> se enlaza para comprobación; el acceso automatizado devolvió 403 en esta sesión. No se verificó directamente su ficha completa.</p><p>En la maqueta aparece una reinterpretación vectorial del vegvísir detrás del personaje, en el panel de equipo. Es una propuesta de sello protector del viajero, sin función de brújula ni giro. Mantiene sus ocho brazos diferenciados como motivo orientativo; requiere cotejo visual con el manuscrito antes de convertirse en asset definitivo. El logo de interfaz usa e.svg de pie. El símbolo frontal del casco permanece en el modelo, sin sustituir el logo.</p></article><article><h3>04 · Amuletos, objetos y mito</h3><p>Un <a href="https://samlinger.natmus.dk/do/object/586875">colgante de martillo de plata dorada</a> del Museo Nacional sirve de referencia material concreta. La exposición <a href="https://en.viking.natmus.dk/viden">The Viking Sorceress</a> muestra una cultura de amuletos, cuentas, cristal de roca y cadenas. También documenta convivencia de cruces y martillos: evitar reducir toda la cultura nórdica a un símbolo único.</p><p>Thor y su martillo permiten proponer protección; el bono +3 de la maqueta es diseño de juego inventado, no una propiedad histórica. Propuestas posteriores: broche de juramento (unión), cuenta de cristal (memoria) y dos aves abstractas (pensamiento y recuerdo). Estas asociaciones de diseño no se presentan como significados arqueológicos demostrados. No se nombra ni representa a Odín, Níðhöggr o Valdheim en la UI del MVP, para preservar el misterio narrativo.</p></article><article><h3>05 · Reglas de interfaz y alcance</h3><ul><li>Mochila rectangular, filtros por tipo y ranuras de equipo con nombres. Nada de menús circulares obligatorios ni texto escrito solo en runas.</li><li>Vida roja, resistencia ámbar y azul rúnico para selección y magia antigua, respetando el HUD actual. Rareza conserva los códigos del juego; no se inventa una escala nueva.</li><li>Runas decorativas o inventadas son válidas como fantasía. Los símbolos reconocibles se registran con procedencia. Texto, cifras e iconos funcionales siempre legibles.</li><li>Comparación con valores actuales, resultado y diferencia; daño por golpe y velocidad separados. No ocultar una pérdida de daño detrás de una flecha de poder global.</li><li>Equipo por partes solicitado por Alejandro: hombros, pechera, brazos, guantes, cinturón, piernas, botas y capa; además de armas, escudo, amuleto y dos anillos. La identidad del casco se conserva. Se prototipa el flujo, sin aprobar modelos nuevos.</li><li>En Godot: textos ES/EN en textos.csv y tr(); acciones InputMap y pistas de Controles; foco con mando, sin arrastrar como requisito. No reutilizar Q/E, Tab o R sin resolver los controles actuales.</li><li>Al equipar: recalcular desde base + modificadores, sin acumular bonos al reequipar; validar tipo de ranura, guardar por ID y actualizar UI por señal. Daño y velocidad deben alimentar el combate real. Un cambio durante un golpe rige desde el siguiente, como ya hace velocidad_ataque.</li><li>Persistencia: versión de guardado y valores por defecto para partidas viejas. Probar equipar/quitar/repetir, dos héroes independientes, carga, daño real, tiempos, foco y ambos idiomas.</li><li>Brillo suave y localizado, sin texturas sucias, grietas gruesas, sangre decorativa ni partículas permanentes. Si se añade un efecto caro, depende de Calidad; el foco permanece visible sin bloom.</li></ul><p><strong>Orden propuesto para acordar:</strong> 1. Validar esta dirección y distribución. 2. Integrar tema, mochila y equipo mínimo con daño/velocidad reales y guardado. 3. Incorporar amuletos con efectos aprobados. 4. Definir maná y hechizos antes de mostrar sus barras o accesos. Esta entrega es una maqueta navegable, no implementa esos sistemas en Godot.</p><p>Estado revisado el 15/10/2026: HUD con vida y resistencia, recurso de estadísticas y velocidad de ataque; sin inventario ni maná completos en la aventura. Se consultó el botín de la arena como antecedente, sin trasladar probabilidades por oleadas al modo aventura. Fuentes enlazadas son referencias; no se incorporan assets de terceros.</p></article>`,en:`<h2>Norse detail can be delicate</h2><p class="lead">Runes provide identity. Engraved silver provides structure. Familiar conventions keep the interface readable.</p><article><h3>01 · Warriors and duels</h3><p>“Norse gladiator” is a useful fantasy, not an established historical institution equivalent to Rome’s gladiators. <a href="https://pure.kb.dk/ws/portalfiles/portal/117969574/1-s2.0-S0278416525000066-main.pdf">Warrior institutions and martial networks in Viking-Age Scandinavia</a> discusses warrior networks, berserkir and ulfheðnar. The <a href="https://natmus.dk/historisk-viden/danmark/oldtid-indtil-aar-1050/vikingetiden-800-1050/vaaben/bersaerk/">National Museum of Denmark</a> notes competing interpretations and limited archaeological evidence. <a href="https://hurstwic.com/history/articles/society/text/drengur.htm">Hurstwic’s saga-based discussion of duelling</a> is a reconstruction reference, not proof of universal rules. We propose measured symmetry and clear weapon/shield silhouettes, without adding a duel system.</p></article><article><h3>02 · Urnes and fine lines</h3><p>The <a href="https://www.britishmuseum.org/collection/term/x95689">British Museum</a> describes slender animals and interlaced ribbons in Urnes art. Its <a href="https://www.britishmuseum.org/collection/object/H_1979-1101-1">Pitney brooch</a> provides a concrete openwork reference. Our adaptation uses fine 1–1.5 px lines, restrained corner ornaments and clear space around labels. No museum images are imported.</p></article><article><h3>03 · Vegvísir</h3><p>The sign is documented in Geir Vigfússon’s Huld manuscript, 1860; that does not establish Viking origins. A <a href="https://commons.wikimedia.org/wiki/File:Vegvisir-huld-p60.png">manuscript reproduction attributed to Iceland’s National and University Library</a> preserves the sign and its wayfinding charm. The <a href="https://handrit.is/manuscript/view/is/IB04-0383">ÍB 383 4to catalogue</a> returned 403 during automated access; its complete record was not directly verified.</p><p>This mockup places an original vector reinterpretation behind the character in the equipment panel: a traveller’s protective seal, without rotation or compass behaviour. Its eight differentiated arms need visual comparison with the manuscript before production. The interface logo uses upright e.svg. The helmet’s frontal symbol stays on the model and does not replace the logo.</p></article><article><h3>04 · Amulets and myth</h3><p>A <a href="https://samlinger.natmus.dk/do/object/586875">gilded silver hammer pendant</a> and <a href="https://en.viking.natmus.dk/viden">The Viking Sorceress exhibition</a> offer material references for pendants, beads, rock crystal and chains. Crosses and hammers could coexist. The mockup’s +3 protection is invented game design, not historical fact.</p><p>Possible later motifs: an oath brooch for bonds, a crystal bead for memory, paired abstract birds for thought and remembrance. These design associations are proposals rather than proven archaeological meanings. Do not reveal Odin, Níðhöggr or Valdheim through MVP ornament.</p></article><article><h3>05 · Proposed implementation</h3><ul><li>Rectangular inventory, named equipment slots and type filters. No mandatory radial menus or rune-only labels.</li><li>Preserve current health red, stamina amber and runic blue. Preserve existing rarity codes rather than inventing new ones.</li><li>Compare current → equipped values with explicit gains and losses. Keep damage per hit separate from attack speed.</li><li>Piece-based armour requested by Alejandro: shoulders, chest, wrists, gloves, waist, legs, boots and cloak, plus weapon, shield, amulet and two rings. Helmet identity stays intact; this mockup does not approve new models.</li><li>Godot text uses textos.csv + tr(); input uses InputMap and Controles prompts, with controller focus and no mandatory dragging. Resolve existing Q/E, Tab and R bindings before assigning new ones.</li><li>Compute base + modifiers without stacking bonuses on repeated equip. Validate slots, save by item ID, update through signals and connect actual combat damage and speed. Changes during an attack apply to the next attack.</li><li>Version saves with defaults for old campaigns. Verify equip/unequip/repeat, independent heroes, loading, real damage, timing, focus and both languages.</li><li>Fine engraving, controlled light, no dirty textures or thick cracks. Expensive effects follow Calidad; focus works without bloom.</li></ul><p><strong>Agreement sequence:</strong> validate this direction; integrate the minimal equipment/inventory and real damage/speed with persistence; approve amulet effects; define mana/spells before displaying their resources. This is an interactive mockup, not Godot gameplay implementation.</p><p>Reviewed 15 October 2026: current adventure HUD has health/stamina and an attack-speed resource, without a complete inventory/mana system. Arena loot was consulted without transferring wave probabilities. Linked sources are references, not imported assets.</p></article>`};

const estado_visor={vista:0,zoom:1,panX:0,panY:0,arrastre:null};
function actualizar_visor(){const sprite=document.getElementById('character-sprite');sprite.style.backgroundPosition=((estado_visor.vista%12)/11*100)+'% '+(Math.floor(estado_visor.vista/12)/2*100)+'%';const visor=document.getElementById('character-view');const ancho=visor.clientWidth,alto=visor.clientHeight,alturaSprite=ancho*1.5;const rostro=alto-32-alturaSprite*0.92;const avance=Math.max(0,Math.min(1,(estado_visor.zoom-1)/2));const enfoque=(alto*0.42-rostro)*avance;const limiteX=ancho*Math.max(0,estado_visor.zoom-1)*0.6,limiteY=alturaSprite*Math.max(0,estado_visor.zoom-1);estado_visor.panX=Math.max(-limiteX,Math.min(limiteX,estado_visor.panX));estado_visor.panY=Math.max(-limiteY,Math.min(limiteY,estado_visor.panY));sprite.style.transform='translate('+estado_visor.panX+'px,'+(enfoque+estado_visor.panY)+'px) scale('+estado_visor.zoom+')';document.getElementById('zoom-value').textContent=Math.round(estado_visor.zoom*100)+'%';document.getElementById('character-view').setAttribute('aria-label',tr('viewer-label'));document.getElementById('viewer-controls').setAttribute('aria-label',tr('viewer-controls'));document.querySelectorAll('[data-view-label]').forEach(b=>{b.setAttribute('aria-label',tr(b.dataset.viewLabel));b.title=tr(b.dataset.viewLabel);});document.getElementById('zoom-out').disabled=estado_visor.zoom<=0.7;document.getElementById('zoom-in').disabled=estado_visor.zoom>=3;}
function girar(pasos){estado_visor.vista=((estado_visor.vista+pasos)%36+36)%36;actualizar_visor();}
function acercar(valor){estado_visor.zoom=Math.max(0.7,Math.min(3,valor));actualizar_visor();}
function restablecer_vista(){estado_visor.vista=0;estado_visor.zoom=1;estado_visor.panX=0;estado_visor.panY=0;actualizar_visor();}
function preparar_visor(){const visor=document.getElementById('character-view');document.getElementById('rotate-left').onclick=()=>girar(-1);document.getElementById('rotate-right').onclick=()=>girar(1);document.getElementById('zoom-out').onclick=()=>acercar(estado_visor.zoom-0.1);document.getElementById('zoom-in').onclick=()=>acercar(estado_visor.zoom+0.1);document.getElementById('reset-view').onclick=restablecer_vista;
visor.addEventListener('pointerdown',e=>{if(estado_visor.arrastre||![0,2].includes(e.button)||(e.button===2&&estado_visor.zoom<=1))return;e.preventDefault();estado_visor.arrastre={id:e.pointerId,x:e.clientX,y:e.clientY,vista:estado_visor.vista,modo:e.button===2?'pan':'giro',panX:estado_visor.panX,panY:estado_visor.panY};visor.setPointerCapture(e.pointerId);visor.classList.add('dragging');visor.focus({preventScroll:true});});
visor.addEventListener('pointermove',e=>{const a=estado_visor.arrastre;if(!a||a.id!==e.pointerId)return;if(a.modo==='pan'){estado_visor.panX=a.panX+e.clientX-a.x;estado_visor.panY=a.panY+e.clientY-a.y;}else{estado_visor.vista=((a.vista+Math.round((e.clientX-a.x)/8))%36+36)%36;}actualizar_visor();});
const terminar=e=>{if(estado_visor.arrastre?.id!==e.pointerId)return;estado_visor.arrastre=null;visor.classList.remove('dragging');if(visor.hasPointerCapture(e.pointerId))visor.releasePointerCapture(e.pointerId);};for(const evento of ['pointerup','pointercancel','lostpointercapture'])visor.addEventListener(evento,terminar);
visor.addEventListener('contextmenu',e=>e.preventDefault());
visor.addEventListener('wheel',e=>{e.preventDefault();const delta=e.deltaY*(e.deltaMode===1?16:e.deltaMode===2?400:1);acercar(estado_visor.zoom*Math.exp(-delta*0.0015));},{passive:false});
visor.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')girar(-1);else if(e.key==='ArrowRight')girar(1);else if(e.key==='+'||e.key==='=')acercar(estado_visor.zoom+0.1);else if(e.key==='-')acercar(estado_visor.zoom-0.1);else if(e.key==='Home')restablecer_vista();else return;e.preventDefault();});actualizar_visor();}

Object.assign(texts.es,{'hud-link':'En juego','sort-type':'Ordenar: tipo','sort-name':'Ordenar: nombre','search-bag':'Buscar en la bolsa','bag-slots':'casillas · capacidad propuesta','bag-count':'objetos guardados','renders-note':'Miniaturas de los modelos actuales: pechera, brazos, botas, capa, espada y escudo. Las variantes comparten referencia hasta tener sus modelos propios.','no-model':'Sin modelo 3D propio'});Object.assign(texts.en,{'hud-link':'In game','sort-type':'Sort: type','sort-name':'Sort: name','search-bag':'Search the bag','bag-slots':'slots · proposed capacity','bag-count':'stored items','renders-note':'Thumbnails from current chest, arm, boot, cloak, sword and shield models. Variants share a reference until they have their own models.','no-model':'No dedicated 3D model'});
let busqueda_bolsa='',orden_bolsa='tipo';
const miniaturas={chest:'pechera',shoulders:'brazo-armadura',wrists:'brazo-armadura',hands:'brazo-armadura',feet:'botas',legs:'botas',back:'capa',weapon:'espada',shield:'escudo'};
function imagen_pieza(i){const modelo=miniaturas[i.slot];return modelo?'<img src="catalogo-'+modelo+'.png" alt="" draggable="false">':'<span class="item-monogram" aria-hidden="true">'+tr(i.slot).slice(0,2).toUpperCase()+'</span>';}
function ranura(slot){const p=pieza(equipo[slot]),s=seleccion();return '<button class="slot '+(p&&p.id===selected?'selected ':'')+(slot==='head'?'locked':'')+'" draggable="'+(!!p&&slot!=='head')+'" data-slot="'+slot+'" aria-label="'+tr(slot)+': '+(p?tr(p.id):tr('empty-slot'))+'"><span>'+tr(slot)+'</span><b>'+(p?tr(p.id):tr('empty-slot'))+'</b></button>';}
function render(){actualizar_visor();document.documentElement.lang=lang;document.querySelectorAll('[data-t]').forEach(e=>e.textContent=tr(e.dataset.t));document.getElementById('language').textContent=lang==='es'?'EN':'ES';document.getElementById('slots-left').innerHTML=['head','shoulders','chest','back','wrists','hands','weapon'].map(ranura).join('');document.getElementById('slots-right').innerHTML=['neck','waist','legs','feet','ring1','ring2','shield'].map(ranura).join('');const t=calcular();document.getElementById('totals').innerHTML=[['armorValue',t.armor],['damage',t.damage],['speed',t.speed+'×']].map(([k,v])=>'<div class="total"><span>'+tr(k)+'</span><b>'+v+'</b></div>').join('');document.querySelectorAll('[data-filter]').forEach(e=>e.setAttribute('aria-pressed',e.dataset.filter===filter));const guardadas=items.filter(i=>i.kind!=='fixed'&&equipo[i.slot]!==i.id);const list=guardadas.filter(i=>(filter==='all'||(filter==='armor'?i.kind==='armor'||i.kind==='ring':i.kind===filter))&&tr(i.id).toLocaleLowerCase().includes(busqueda_bolsa.toLocaleLowerCase())).sort((a,b)=>orden_bolsa==='nombre'?tr(a.id).localeCompare(tr(b.id)):a.slot.localeCompare(b.slot)||tr(a.id).localeCompare(tr(b.id)));document.getElementById('inventory-count').textContent=guardadas.length+' '+tr('bag-count')+' · 40 '+tr('bag-slots');document.getElementById('bag-search').placeholder=tr('search-bag');document.getElementById('bag-search').setAttribute('aria-label',tr('search-bag'));document.getElementById('bag-sort').setAttribute('aria-label',tr('sort-type'));document.getElementById('grid').innerHTML=list.map(i=>'<button class="item" draggable="true" data-id="'+i.id+'" title="'+tr(i.id)+' · '+tr(i.slot)+'" aria-label="'+tr(i.id)+'" aria-pressed="'+(i.id===selected)+'">'+imagen_pieza(i)+'<span class="item-label">'+tr(i.id)+'</span></button>').join('')+Array.from({length:Math.max(0,40-list.length)},()=>'<div class="empty" aria-hidden="true"></div>').join('');document.getElementById('research').innerHTML=studies[lang];detail();}
function seleccionar(id){if(!pieza(id))return;selected=id;document.querySelectorAll('[data-id]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.id===id));document.querySelectorAll('[data-slot]').forEach(b=>{b.classList.toggle('selected',equipo[b.dataset.slot]===id);});detail();}

Object.assign(texts.es,{'in-bag':'En la mochila · sin equipar','wearing':'Equipado en el personaje','wrong-slot':'Esta pieza no corresponde a esa ranura.','drag-help':'Soltá en una ranura compatible o en la mochila.'});Object.assign(texts.en,{'in-bag':'In the bag · not equipped','wearing':'Equipped on character','wrong-slot':'This piece does not fit that slot.','drag-help':'Drop onto a matching slot or into the bag.'});
let pieza_arrastrada=null;
function mover_pieza(id,accion,ranura=null){const i=pieza(id);if(!i||i.kind==='fixed')return false;if(accion==='equipar'){if(ranura&&ranura!==i.slot){document.getElementById('message').textContent=tr('wrong-slot');return false;}equipo[i.slot]=i.id;}else if(accion==='quitar'){if(equipo[i.slot]!==id)return false;equipo[i.slot]=null;filter='all';busqueda_bolsa='';document.getElementById('bag-search').value='';}else return false;selected=id;render();document.getElementById('message').textContent=tr(accion==='quitar'?'removed':'done');const destino=document.querySelector('[data-id="'+id+'"]')||document.querySelector('[data-slot="'+i.slot+'"]');destino?.focus({preventScroll:true});return true;}
function alternar_pieza(id){const i=pieza(id);if(i)mover_pieza(id,equipo[i.slot]===id?'quitar':'equipar');}
function objetivo_pieza(e){const boton=e.target.closest('[data-id],[data-slot]');if(!boton)return null;return {boton,id:boton.dataset.id||equipo[boton.dataset.slot]||null};}
function limpiar_arrastre(){pieza_arrastrada=null;document.querySelectorAll('.drop-valid,.drop-invalid').forEach(n=>n.classList.remove('drop-valid','drop-invalid'));}
function preparar_equipo(){for(const id of ['grid','slots-left','slots-right']){const raiz=document.getElementById(id);
raiz.addEventListener('click',e=>{if(e.button!==0)return;const o=objetivo_pieza(e);if(o?.id)seleccionar(o.id);else if(o?.boton.dataset.slot){const p=items.find(i=>i.slot===o.boton.dataset.slot);if(p)seleccionar(p.id);}});
raiz.addEventListener('dblclick',e=>{const o=objetivo_pieza(e);if(e.button!==0||e.detail!==2||!o?.id)return;e.preventDefault();alternar_pieza(o.id);});
raiz.addEventListener('contextmenu',e=>{const o=objetivo_pieza(e);if(!o)return;e.preventDefault();if(o.id)alternar_pieza(o.id);});
raiz.addEventListener('dragstart',e=>{const o=objetivo_pieza(e),i=o&&pieza(o.id);if(!i||i.kind==='fixed'){e.preventDefault();return;}pieza_arrastrada={id:i.id,origen:o.boton.dataset.slot?'equipo':'mochila'};e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('application/x-eromash-item',i.id);});raiz.addEventListener('dragend',limpiar_arrastre);
if(id!=='grid'){raiz.addEventListener('dragover',e=>{if(!pieza_arrastrada)return;const o=objetivo_pieza(e);if(!o)return;const valida=pieza(pieza_arrastrada.id).slot===o.boton.dataset.slot;e.preventDefault();e.dataTransfer.dropEffect=valida?'move':'none';o.boton.classList.toggle('drop-valid',valida);o.boton.classList.toggle('drop-invalid',!valida);});raiz.addEventListener('dragleave',e=>{const o=objetivo_pieza(e);o?.boton.classList.remove('drop-valid','drop-invalid');});raiz.addEventListener('drop',e=>{if(!pieza_arrastrada)return;e.preventDefault();const o=objetivo_pieza(e),id=pieza_arrastrada.id;limpiar_arrastre();if(o)mover_pieza(id,'equipar',o.boton.dataset.slot);});}}
const bolsa=document.getElementById('bag-drop-zone');bolsa.addEventListener('dragover',e=>{if(pieza_arrastrada?.origen!=='equipo')return;e.preventDefault();e.dataTransfer.dropEffect='move';bolsa.classList.add('drop-valid');});bolsa.addEventListener('dragleave',()=>bolsa.classList.remove('drop-valid'));bolsa.addEventListener('drop',e=>{if(!pieza_arrastrada)return;e.preventDefault();const arrastre=pieza_arrastrada;limpiar_arrastre();if(arrastre.origen==='equipo')mover_pieza(arrastre.id,'quitar');});}

function detail(){const i=seleccion();const puesta=equipo[i.slot]===i.id;const estado=document.getElementById('selection-status');estado.textContent=tr(puesta?'wearing':'in-bag');estado.classList.toggle('is-equipped',puesta);document.getElementById('detail-name').textContent=tr(i.id);document.getElementById('detail-slot').textContent=tr(i.slot);document.getElementById('detail-type').textContent=tr(i.kind==='weapon'?'weaponType':i.kind==='amulet'?'amuletType':i.kind==='fixed'?'locked':i.kind==='ring'?'ringType':'armorType');document.getElementById('flavor').textContent=texts[lang][i.id+'Flavor']||tr('slotOnly');const actual=calcular(),despues=calcular({...equipo,[i.slot]:i.id});let keys=i.kind==='weapon'?[['damage','damage',''],['speed','speed','×'],['attack','cost','']]:i.kind==='amulet'?[['protection','protection','']]:[['armorValue','armor','']];document.getElementById('stats').innerHTML=keys.map(([label,k,u])=>{const a=actual[k],b=despues[k],d=Math.round((b-a)*100)/100;return '<div class="stat"><span>'+tr(label)+'</span><span>'+a+u+' → '+b+u+' <span class="'+(d===0?'muted':(k==='cost'?d<0:d>0)?'change':'loss')+'">('+(d===0?tr('same'):(d>0?'+':'')+d+u)+')</span></span></div>';}).join('');document.getElementById('impact').textContent=tr(i.kind==='weapon'?'impact':i.kind==='amulet'?'amuletImpact':'armorImpact');const b=document.getElementById('equip');b.textContent=tr(equipo[i.slot]===i.id?'equipped':'equip');b.disabled=equipo[i.slot]===i.id||i.kind==='fixed';document.getElementById('unequip').disabled=!equipo[i.slot]||i.kind==='fixed';document.getElementById('message').textContent='';}
document.getElementById('equip').onclick=()=>mover_pieza(selected,'equipar');document.getElementById('unequip').onclick=()=>{const i=seleccion();if(equipo[i.slot])mover_pieza(equipo[i.slot],'quitar');};document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render();});document.getElementById('language').onclick=()=>{lang=lang==='es'?'en':'es';render();};document.getElementById('to-design').onclick=()=>document.getElementById('design').scrollIntoView({behavior:'smooth'});document.getElementById('to-research').onclick=()=>document.getElementById('research').scrollIntoView({behavior:'smooth'});document.getElementById('bag-search').addEventListener('input',e=>{busqueda_bolsa=e.target.value;render();});document.getElementById('bag-sort').addEventListener('change',e=>{orden_bolsa=e.target.value;render();});preparar_visor();preparar_equipo();render();
</script></html>
