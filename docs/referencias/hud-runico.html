const $=id=>document.getElementById(id);
function aviso(texto){clearTimeout(temporizador_aviso);$('toast').textContent=texto;$('toast').classList.add('visible');temporizador_aviso=setTimeout(()=>$('toast').classList.remove('visible'),2600);}
function render(){document.documentElement.lang=idioma;document.querySelectorAll('[data-t]').forEach(e=>e.textContent=tr(e.dataset.t));$('language').textContent=idioma==='es'?'EN':'ES';$('stage').classList.toggle('combat',escena==='combat');$('stage').classList.toggle('critical',recursos.health<30);$('stage').classList.toggle('magic',magia);$('magic').setAttribute('aria-pressed',magia);$('fold').setAttribute('aria-label',tr('fold'));document.querySelectorAll('[data-scene]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.scene===escena));for(const k of ['health','stamina','mana']){$('value-'+k).textContent=recursos[k]+' / 100';$('fill-'+k).style.width=recursos[k]+'%';$('bar-'+k).setAttribute('aria-valuenow',recursos[k]);$('bar-'+k).setAttribute('aria-label',tr(k));}$('res-health').classList.toggle('low',recursos.health<30);
$('skill-row').innerHTML=barra.map((id,i)=>{const h=id&&habilidades[id],bloqueada=i>3&&!magia;return '<button class="skill '+(bloqueada?'locked':'')+'" data-slot="'+i+'" aria-label="'+(h?tr(id):tr(bloqueada?'locked':'empty'))+'" aria-pressed="'+(ranura_activa===i)+'"><span class="key">'+(h?tr(h.tecla):'—')+'</span><span class="rune" aria-hidden="true">'+(h?h.runa:bloqueada?'◇':'+')+'</span><span class="number">'+(i+1)+'</span><span class="cooldown" data-cd="'+i+'"></span></button>';}).join('');document.querySelectorAll('[data-slot]').forEach(b=>{const indice=Number(b.dataset.slot),id=barra[indice];b.title=id?tr(id):tr(indice>3&&!magia?'locked':'empty');b.onclick=()=>abrir(indice);b.onmouseenter=b.onfocus=()=>{$('skill-name').textContent=b.title;};b.onmouseleave=()=>{$('skill-name').textContent=ranura_activa!==null&&barra[ranura_activa]?tr(barra[ranura_activa]):tr('none-selected');};});
$('potions').innerHTML=['health','stamina','mana'].map((k,i)=>'<button class="potion" data-potion="'+k+'" title="'+tr('potion-'+k)+' · '+tr('demo')+'" aria-label="'+tr('potion-'+k)+': '+pociones[k]+'"><span class="potion-key">'+'—'+'</span><span class="bottle" aria-hidden="true"></span><span class="count">'+pociones[k]+'</span><span class="potion-cd" data-potion-cd="'+k+'" hidden></span></button>').join('');document.querySelectorAll('[data-potion]').forEach(b=>b.onclick=()=>beber(b.dataset.potion));$('skill-name').textContent=ranura_activa!==null&&barra[ranura_activa]?tr(barra[ranura_activa]):tr('none-selected');if(!$('drawer').hidden)render_panel();actualizar_recargas();}
function abrir(indice){if(indice>3&&!magia){aviso(tr('locked'));return;}ranura_activa=indice;$('drawer').hidden=false;render();$('close-drawer').focus();}
function cerrar(){$('drawer').hidden=true;document.querySelector('[data-slot="'+ranura_activa+'"]')?.focus();}
function render_panel(){const id=barra[ranura_activa];$('drawer-title').textContent=tr('choose')+' · '+(ranura_activa+1);$('drawer-description').textContent=tr(id&&habilidades[id].futura?'future-text':'choose-text');$('drawer-list').innerHTML=Object.entries(habilidades).filter(([k,h])=>!h.futura||magia).map(([k,h])=>'<button data-ability="'+k+'" aria-pressed="'+(id===k)+'"><span class="rune" aria-hidden="true">'+h.runa+'</span><span>'+tr(k)+'</span></button>').join('');document.querySelectorAll('[data-ability]').forEach(b=>b.onclick=()=>asignar(b.dataset.ability));$('use-skill').disabled=!id;$('clear-skill').disabled=!id;}
function asignar(id){if(!habilidades[id]||(habilidades[id].futura&&!magia))return;const anterior=barra.indexOf(id);if(anterior!==-1&&anterior!==ranura_activa)barra[anterior]=barra[ranura_activa];barra[ranura_activa]=id;render();document.querySelector('[data-ability="'+id+'"]')?.focus();}
function usar(){const id=barra[ranura_activa],h=habilidades[id];if(!h)return;if((recargas[id]||0)>Date.now()){aviso(tr('not-ready'));return;}if(h.stamina&&recursos.stamina<h.stamina){aviso(tr('no-stamina'));return;}if(h.mana&&recursos.mana<h.mana){aviso(tr('no-mana'));return;}if(h.stamina)recursos.stamina-=h.stamina;if(h.mana)recursos.mana-=h.mana;recargas[id]=Date.now()+h.recarga*1000;render();aviso(tr('used')+' · '+tr(id));cerrar();}
function beber(k){if(k==='mana'&&!magia)return;if(Date.now()<recarga_pociones){aviso(tr('not-ready'));return;}if(pociones[k]===0){aviso(tr('no-potion'));return;}if(recursos[k]===100){aviso(tr('full'));return;}pociones[k]--;recursos[k]=Math.min(100,recursos[k]+40);recarga_pociones=Date.now()+5000;render();aviso(tr('heal')+' · '+tr(k));}
function actualizar_recargas(){const ahora=Date.now();document.querySelectorAll('[data-cd]').forEach(n=>{const id=barra[Number(n.dataset.cd)],segundos=id?Math.max(0,Math.ceil(((recargas[id]||0)-ahora)/1000)):0;n.textContent=segundos||'';n.parentElement.classList.toggle('cooling',segundos>0);});document.querySelectorAll('[data-potion-cd]').forEach(n=>{const segundos=Math.max(0,Math.ceil((recarga_pociones-ahora)/1000));n.hidden=segundos===0;n.style.display=segundos?'grid':'none';n.textContent=segundos||'';});}
function cambiar_escena(nombre){escena=nombre;recursos.health=nombre==='critical'?22:nombre==='combat'?63:82;recursos.stamina=nombre==='combat'?38:76;render();}
document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>cambiar_escena(b.dataset.scene));$('language').onclick=()=>{idioma=idioma==='es'?'en':'es';render();};$('magic').onclick=()=>{magia=!magia;if(!magia){barra=barra.map(id=>id&&habilidades[id].futura?null:id);if(ranura_activa>3)cerrar();}else{if(!barra[4])barra[4]='pulse';if(!barra[5])barra[5]='ward';}render();};$('reset').onclick=()=>{barra=['attack','guard','dodge','lens',magia?'pulse':null,magia?'ward':null];recursos={health:82,stamina:76,mana:64};pociones={health:3,stamina:2,mana:2};recargas={};recarga_pociones=0;escena='explore';ranura_activa=null;$('drawer').hidden=true;render();};$('fold').onclick=()=>{const cerrado=$('quest-body').hidden=!$('quest-body').hidden;$('fold').textContent=cerrado?'+':'−';$('fold').setAttribute('aria-expanded',!cerrado);};$('journal').onclick=()=>aviso(tr('journal-text'));$('close-drawer').onclick=cerrar;$('use-skill').onclick=usar;$('clear-skill').onclick=()=>{barra[ranura_activa]=null;render();cerrar();};document.addEventListener('keydown',e=>{if(e.key==='Escape')cerrar();});setInterval(actualizar_recargas,150);render();
</script>
</html>
